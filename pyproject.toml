[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filinglens"
version = "0.1.0"
description = "Multimodal Financial Filing Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]